<section class="equipe">

  <app-gestion-equipe [(actif)]="onglet">
    @if (isAdmin) {
      <label for="cinema">Cinéma</label>
      <select id="cinema" (change)="onCinemaChange($event)">
        @for (c of cinemas(); track c.id) {
          <option [value]="c.id" [selected]="c.id === cinemaId()">{{ c.nom }}</option>
        }
      </select>
    }
  </app-gestion-equipe>

  <div class="equipe-contenu">
    @switch (onglet()) {
      @case ('utilisateurs') {
        <app-utilisateur-page />
      }
      @case ('films') {
        <app-gestion-film />
      }
      @case ('seances') {
        @if (!isAdmin || cinemaId() !== null) {
          <app-prog-seance />
        }
      }
      @case ('billetterie') {
        <app-place-page />
      }
      @case ('cinema') {
        @if (isAdmin) {
          <app-cinema-gestion />
        }
      }
      @case ('responsable') {
        @if (isAdmin) {
          <app-responsable-page />
        }
      }
    }
  </div>

</section>
