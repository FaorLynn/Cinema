<header>
  <a class="brand" aria-label="Accueil Pathé D’Canard">
    <span class="duck">◕</span> PATHÉ <b>D’CANARD</b>
    <small>LE CINÉMA QUI VOUS FAIT COIN-COIN.</small>
  </a>
  <nav>
    <a [routerLink]="['/films']" routerLinkActive="active">A l'affiche</a>

    @if (authService.hasRole('UTILISATEUR')) {
      <a [routerLink]="['/reservations']" routerLinkActive="active">Mes réservations</a>
      <a [routerLink]="['/parametres']" routerLinkActive="active"> Paramètres</a>
    }

    @if (authService.hasRole('ADMIN', 'RESPONSABLE')) {
      <a [routerLink]="['/equipe']" routerLinkActive="active">Espace Equipe</a>
    }

    <button (click)="logout()">Déconnexion</button>
  </nav>
  <span class="demo">Depuis · 2026</span>
</header>
